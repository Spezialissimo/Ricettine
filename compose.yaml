services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ricettine
      POSTGRES_DB: ricettine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ricettine}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricettine -d ricettine"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ghcr.io/spezialissimo/ricettine:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ricettine
      SPRING_DATASOURCE_USERNAME: ricettine
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ricettine}
      # Set to your public URL in production, e.g. https://recipes.example.com
      RICETTINE_BASE_URL: ${RICETTINE_BASE_URL:-}
    volumes:
      - app-data:/data
    ports:
      - "8080:8080"

volumes:
  db-data:
  app-data:

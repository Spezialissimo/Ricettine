spring:
  application:
    name: ricettine
  datasource:
    url: jdbc:postgresql://localhost:5432/ricettine
    username: ricettine
    password: ricettine
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
      # Uploads stream straight to disk (never held in heap) in a dedicated directory, created at startup.
      file-size-threshold: 0
      location: ${java.io.tmpdir}/ricettine-uploads
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
server:
  tomcat:
    # Lets Tomcat drain an oversize upload so the client sees 413 instead of a broken pipe.
    max-swallow-size: 16MB
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
management:
  endpoints:
    web:
      exposure:
        include: health
ricettine:
  media:
    # Concurrent image decodes; others wait (processing-wait, default 30s), then 503 busy.
    max-concurrent-processing: 2
    # Recipe photos uploaded but never saved into a recipe are deleted once older than orphan-min-age.
    orphan-cleanup-interval: PT1H
    orphan-min-age: PT24H
  limits:
    # count per fixed window, in memory per instance. Override e.g. RICETTINE_LIMITS_LOGINIP_LIMIT=100.
    login-account: { limit: 10, window: PT15M }
    login-ip: { limit: 30, window: PT15M }
    anonymous-auth: { limit: 30, window: PT15M }
    uploads: { limit: 60, window: PT10M }
    profile: { limit: 120, window: PT1M }
  security:
    # argon2 needs ~16 MB per hash; more concurrent hashes wait (up to 10 s, then 503 busy).
    max-concurrent-hashes: 4
  storage:
    type: local
    local:
      path: ./data/media
    s3:
      path-style: false
      api-call-timeout: PT30S
      api-call-attempt-timeout: PT10S
      connection-timeout: PT5S

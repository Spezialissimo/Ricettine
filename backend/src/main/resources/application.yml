spring:
  application:
    name: ricettine
  datasource:
    url: jdbc:postgresql://localhost:5432/ricettine
    username: ricettine
    password: ricettine
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
management:
  endpoints:
    web:
      exposure:
        include: health
